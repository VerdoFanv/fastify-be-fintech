apiVersion: v1
kind: Secret
metadata:
  name: fintech-api-secrets
  namespace: fintech
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fastify_be_fintech?schema=public
  JWT_SECRET: change-me-to-a-long-secret
  API_KEY: change-me-to-a-long-api-key
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET: fintech-uploads
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH_STYLE: 'true'
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:9092
  OTEL_ENABLED: 'false'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

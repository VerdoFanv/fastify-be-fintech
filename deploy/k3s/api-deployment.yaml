apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-api
  namespace: fintech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fintech-api
  template:
    metadata:
      labels:
        app: fintech-api
    spec:
      containers:
        - name: api
          image: fintech-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: fintech-api-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: AWS_REGION
              value: us-east-1
            - name: JWT_EXPIRES_IN
              value: 7d
            - name: KAFKA_CLIENT_ID
              value: fintech-api
            - name: KAFKA_GROUP_ID
              value: fintech-webhook-workers
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
# Dedicated NodePort — jangan pakai Ingress catch-all di :80 (IP shared banyak project).
apiVersion: v1
kind: Service
metadata:
  name: fintech-api
  namespace: fintech
spec:
  type: NodePort
  selector:
    app: fintech-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30110
